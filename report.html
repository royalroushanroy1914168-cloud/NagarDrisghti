<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* REPORT FORM */

.report-section {
  padding: 90px 20px;
  background: #f5f7fa;
}

.report-container {
  max-width: 850px;
  margin: auto;
}

.report-heading {
  text-align: center;
  margin-bottom: 35px;
}

.report-heading h2 {
  font-size: 42px;
  margin: 10px 0;
  color: #17365d;
}

.report-heading p {
  color: #667085;
  font-size: 17px;
}

.section-label {
  color: #c56b4b;
  font-weight: bold;
  letter-spacing: 2px;
}

.report-form {
  background: white;
  padding: 35px;
  border-radius: 18px;
  box-shadow: 0 10px 35px rgba(0,0,0,0.08);
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  font-weight: 600;
  margin-bottom: 8px;
  color: #26384a;
}

.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 14px;
  border: 1px solid #d5dbe1;
  border-radius: 9px;
  font-size: 15px;
  font-family: inherit;
  outline: none;
}

.form-group textarea {
  resize: vertical;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  border-color: #1769aa;
}

.form-group small {
  display: block;
  margin-top: 7px;
  color: #777;
}

.submit-report-btn {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 9px;
  background: #1769aa;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.submit-report-btn:hover {
  opacity: 0.9;
}

#reportMessage {
  margin-top: 20px;
  text-align: center;
  font-weight: bold;
}

.report-success {
  padding: 15px;
  border-radius: 9px;
  background: #e8f7ee;
  color: #18733c;
}

@media (max-width: 700px) {
  .form-row {
    grid-template-columns: 1fr;
  }

  .report-heading h2 {
    font-size: 32px;
  }

  .report-form {
    padding: 22px;
  }
}
    </style>
</head>
<body>
    <section class="report-section" id="report-section">
  <div class="report-container">

    <div class="report-heading">
      <span class="section-label">CITIZEN REPORT</span>
      <h2>Report a Civic Problem</h2>
      <p>
        Help make your city cleaner, safer and smarter.
        Report a problem and help authorities take action.
      </p>
    </div>

    <form id="reportForm" class="report-form">

      <div class="form-row">
        <div class="form-group">
          <label for="name">Your Name</label>
          <input
            type="text"
            id="name"
            placeholder="Enter your name"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          >
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="problemType">Problem Type</label>
          <select id="problemType" required>
            <option value="">Select problem</option>
            <option value="Pothole">🕳️ Pothole</option>
            <option value="Broken Road">🛣️ Broken Road</option>
            <option value="Garbage">🗑️ Garbage</option>
            <option value="Broken Streetlight">💡 Broken Streetlight</option>
            <option value="Blocked Drain">🌧️ Blocked Drain</option>
            <option value="Water Leakage">💧 Water Leakage</option>
            <option value="Broken Footpath">🚶 Broken Footpath</option>
            <option value="Other">⚠️ Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="severity">Severity</label>
          <select id="severity" required>
            <option value="">Select severity</option>
            <option value="LOW">Low</option>
            <option value="MEDIUM">Medium</option>
            <option value="HIGH">High</option>
            <option value="CRITICAL">Critical</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="location">Location</label>
        <input
          type="text"
          id="location"
          placeholder="Enter street, area or landmark"
          required
        >
      </div>

      <div class="form-group">
        <label for="description">Describe the Problem</label>
        <textarea
          id="description"
          rows="5"
          placeholder="Explain what is wrong..."
          required
        ></textarea>
      </div>

      <div class="form-group">
        <label for="photo">Upload Photograph</label>
        <input
          type="file"
          id="photo"
          accept="image/*"
          required
        >
        <small>Upload a clear photograph of the civic problem.</small>
      </div>

      <button type="submit" class="submit-report-btn">
        📤 Submit Report
      </button>

      <div id="reportMessage"></div>

    </form>
  </div>
</section>

    
</body>
</html>
